<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>IP</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let servidor of servidores">
      <td>{{ servidor.nombre }}</td>
      <td>{{ servidor.ip }}</td>
      <td>{{ servidor.estado }}</td>
    </tr>
  </tbody>
</table>
